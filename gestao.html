<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Comercial | Amigão</title><style>body{margin:0;background:#f3f5f8;color:#253348;font:15px system-ui,Arial}header{background:#b90d16;color:white;padding:24px}header small{color:#ffe66d;font-weight:700}main{max-width:1100px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{background:white;border:1px solid #e2e6ed;border-radius:14px;padding:17px;margin-bottom:15px}.card small{color:#68778a}.card strong{display:block;color:#b90d16;font-size:25px;margin-top:7px}input,select,button,a.action{font:inherit;padding:10px;border:1px solid #d5dce5;border-radius:8px;background:white}button,a.action{cursor:pointer;text-decoration:none;color:#b90d16;font-weight:700}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}.filters input{flex:2 1 200px}.filters select{flex:1 1 130px}.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #e2e6ed}.item .info{flex:1 1 220px}.info small{display:block;color:#65758a}.bar{display:flex;align-items:center;gap:12px;margin:12px 0}.bar span{width:90px}.track{flex:1;background:#edf0f5;border-radius:12px;height:12px;overflow:hidden}.fill{height:100%;background:#b90d16}.bar b{width:30px;text-align:right}#msg{color:#6b7585}</style></head><body><header><small>AMIGÃO PEÇAS E SERVIÇOS</small><h1>Gestão Comercial</h1><div>Indicadores e histórico de cotações</div></header><main><p><a class="action" href="index.html">← Nova Cotação</a> <button onclick="load()">Atualizar dados</button></p><p id="msg">Conectando...</p><div id="cards" class="cards"></div><section><h3>Distribuição por status</h3><div id="bars"></div></section><section><h3>Histórico de cotações</h3><div class="filters"><input id="q" placeholder="Cliente, placa, veículo ou cotação" oninput="render()"><select id="status" onchange="render()"><option value="">Todos os status</option><option>Pendente</option><option>Aprovada</option><option>Recusada</option><option>Concluída</option></select><select id="period" onchange="render()"><option value="0">Todo o período</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="365">Últimos 12 meses</option></select></div><div id="items"></div></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="firebase.js"></script><script>
let records=[],user=null;
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function amount(v){let s=String(v||"0").replace(/[^0-9,.-]/g,"");return Number(s.replace(/\./g,"").replace(",","."))||0;}
function filtered(){const d=Number($("period").value);return records.filter(x=>!d||(x.data&&Date.now()-new Date(x.data).getTime()<=d*86400000));}
function render(){const base=filtered(),approved=base.filter(x=>["Aprovada","Concluída"].includes(x.status)),k=[["Cotações",base.length],["Pendentes",base.filter(x=>!x.status||x.status==="Pendente").length],["Aprovadas / concluídas",approved.length],["Taxa de aprovação",base.length?(approved.length/base.length*100).toFixed(1).replace(".",",")+"%":"0%"],["Valor aprovado",money(approved.reduce((n,x)=>n+amount(x.total),0))]];$("cards").replaceChildren();for(const [name,value] of k){const c=document.createElement("div");c.className="card";const a=document.createElement("small"),b=document.createElement("strong");a.textContent=name;b.textContent=value;c.append(a,b);$("cards").append(c);}
$("bars").replaceChildren();for(const [name,color] of [["Aprovada","#16834a"],["Pendente","#c68a13"],["Recusada","#b90d16"],["Concluída","#235daa"]]){const count=base.filter(x=>(x.status||"Pendente")===name).length,row=document.createElement("div");row.className="bar";const a=document.createElement("span");a.textContent=name;const track=document.createElement("div");track.className="track";const fill=document.createElement("div");fill.className="fill";fill.style.width=(base.length?count/base.length*100:0)+"%";fill.style.background=color;track.append(fill);const b=document.createElement("b");b.textContent=count;row.append(a,track,b);$("bars").append(row);}
const q=$("q").value.toLowerCase(),status=$("status").value;$("items").replaceChildren();let list=base.filter(x=>(!status||(x.status||"Pendente")===status)&&[x.numero,x.cliente,x.veiculo,x.placa].some(v=>String(v||"").toLowerCase().includes(q)));if(!list.length){$("items").textContent="Nenhuma cotação encontrada.";return;}
for(const x of list){const row=document.createElement("div");row.className="item";const info=document.createElement("div");info.className="info";const strong=document.createElement("strong");strong.textContent=(x.numero||"Sem número")+" — "+(x.cliente||"Sem cliente");const small=document.createElement("small");small.textContent=[x.veiculo,x.placa,x.total,x.data?new Date(x.data).toLocaleDateString("pt-BR"):""].filter(Boolean).join(" | ");info.append(strong,small);const select=document.createElement("select");select.setAttribute("aria-label","Status de "+x.numero);for(const st of ["Pendente","Aprovada","Recusada","Concluída"]){const o=document.createElement("option");o.value=st;o.textContent=st;select.append(o);}select.value=x.status||"Pendente";select.onchange=()=>saveStatus(x,select.value);const open=document.createElement("a");open.className="action";open.href="index.html";open.textContent="Abrir sistema";row.append(info,select,open);$("items").append(row);}}
async function saveStatus(x,status){const old=x.status;x.status=status;render();try{await db.collection("usuarios").doc(user.uid).collection("cotacoes").doc(x.numero).set({...x,status,atualizadoEm:new Date().toISOString()},{merge:true});$("msg").textContent="Status de "+x.numero+" salvo na nuvem.";}catch(e){x.status=old;render();$("msg").textContent="Erro ao salvar status: "+e.message;}}
async function load(){if(!user)return;$("msg").textContent="Carregando cotações...";try{const snap=await db.collection("usuarios").doc(user.uid).collection("cotacoes").get();records=snap.docs.map(d=>d.data()).sort((a,b)=>String(b.data||"").localeCompare(String(a.data||"")));$("msg").textContent=records.length+" cotações sincronizadas da nuvem.";render();}catch(e){$("msg").textContent="Erro ao consultar a nuvem: "+e.message;}}
auth.onAuthStateChanged(u=>{if(!u){location.href="login.html";return;}user=u;load();});
</script></body></html>
